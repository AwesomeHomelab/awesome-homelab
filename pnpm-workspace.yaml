allowBuilds:
  esbuild: true
  workerd: true
# Vite+ publishes its Vite core under the Vite+ version.
peerDependencyRules:
  allowedVersions:
    vite: ^1.5.0
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@^1.5.0
  vitest: ^5.1.0
minimumReleaseAgeExclude:
