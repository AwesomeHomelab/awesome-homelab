  - "@void/deploy-cloudflare@1.7.0"
  - "@void/deploy-core@1.7.0"
  - "@void/edge@1.7.0"
  - "@void/isr@1.7.0"
  - "@void/platform@1.7.0"
  - void@1.7.0
  - "@void/react@1.7.0"
