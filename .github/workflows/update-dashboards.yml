name: Update dashboards

on:
  schedule:
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: Agili
  GIT_AUTHOR_EMAIL: git@agili.app
  GIT_COMMITTER_NAME: Agili
  GIT_COMMITTER_EMAIL: git@agili.app

concurrency:
  group: update-dashboards

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ['--frozen-lockfile', '--ignore-scripts']
      - name: Update dashboards
        id: update
        continue-on-error: true
        run: node scripts/update-dashboards.ts
      - name: Publish updates
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git diff --check
          git diff --quiet -- registry/sources.json && exit 0
          vp run registry:build
          git fetch origin "$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git add registry/sources.json
          git commit -m "chore: update dashboards"
          git push origin "HEAD:$DEFAULT_BRANCH"
      - name: Check update result
        if: steps.update.outcome == 'failure'
        run: exit 1
